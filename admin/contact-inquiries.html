<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ管理｜一箕地区ポータル</title>

    <link rel="stylesheet" href="./admin.css">

    <link rel="icon" href="/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon">

    <style>
        .contact-admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .contact-admin-header h1 {
            margin-bottom: 6px;
        }

        .contact-admin-back {
            display: inline-block;
            padding: 10px 18px;
            background: #175b39;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }

        .contact-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .contact-toolbar input {
            flex: 1;
            min-width: 240px;
            padding: 11px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .contact-toolbar button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: #175b39;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .contact-summary {
            margin-bottom: 18px;
            padding: 14px 18px;
            background: #f1f7f3;
            border-radius: 8px;
        }

        .contact-table-wrap {
            width: 100%;
            overflow-x: auto;
            background: #fff;
            border-radius: 10px;
        }

        .contact-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .contact-table th,
        .contact-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #e5e5e5;
            text-align: left;
            vertical-align: middle;
        }

        .contact-table th {
            background: #175b39;
            color: #fff;
            white-space: nowrap;
        }

        .contact-table tbody tr:hover {
            background: #f6faf7;
        }

        .contact-detail-button {
            padding: 7px 14px;
            border: 0;
            border-radius: 6px;
            background: #2f7d50;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .contact-loading,
        .contact-message {
            padding: 24px;
            text-align: center;
        }

        .contact-message.error {
            color: #a51d1d;
            background: #fff1f1;
            border-radius: 8px;
        }

        /* 詳細モーダル */

        .contact-modal[hidden] {
            display: none;
        }

        .contact-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        .contact-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
        }

        .contact-modal-panel {
            position: relative;
            width: min(720px, calc(100% - 32px));
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            margin: 30px auto;
            padding: 28px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .contact-modal-panel h2 {
            margin-top: 0;
            padding-bottom: 12px;
            border-bottom: 2px solid #175b39;
        }

        .contact-detail-list {
            margin: 0;
        }

        .contact-detail-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .contact-detail-row dt {
            font-weight: 700;
        }

        .contact-detail-row dd {
            margin: 0;
            word-break: break-word;
        }

        .contact-message-body {
            white-space: pre-wrap;
            line-height: 1.8;
        }

        .contact-modal-actions {
            margin-top: 24px;
            text-align: right;
        }

        .contact-modal-actions button {
            padding: 10px 22px;
            border: 0;
            border-radius: 8px;
            background: #555;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .contact-admin-header {
                display: block;
            }

            .contact-admin-back {
                margin-top: 12px;
            }

            .contact-detail-row {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-wrap">

        <div class="contact-admin-header">
            <div>
                <h1>お問い合わせ管理</h1>
                <p>
                    一箕地区ポータルから受け付けた
                    お問い合わせを確認します。
                </p>
            </div>

            <a href="./index.html" class="contact-admin-back">
                管理トップへ戻る
            </a>
        </div>

        <div class="contact-toolbar">

            <input type="search" id="contact-search" placeholder="受付番号・氏名・件名・メールで検索">

            <button type="button" id="contact-refresh">
                再読み込み
            </button>

        </div>

        <div id="contact-summary" class="contact-summary">
            読み込み中...
        </div>

        <div id="contact-message" class="contact-message" hidden>
        </div>

        <div id="contact-loading" class="contact-loading">
            お問い合わせを読み込んでいます...
        </div>

        <div id="contact-table-wrap" class="contact-table-wrap" hidden>

            <table class="contact-table">

                <thead>
                    <tr>
                        <th>受付日時</th>
                        <th>受付番号</th>
                        <th>氏名</th>
                        <th>種別</th>
                        <th>件名</th>
                        <th>メール</th>
                        <th>詳細</th>
                    </tr>
                </thead>

                <tbody id="contact-table-body">
                </tbody>

            </table>

        </div>

    </main>


    <!-- 詳細画面 -->
    <div id="contact-modal" class="contact-modal" hidden>

        <div class="contact-modal-backdrop" data-close-contact-modal>
        </div>

        <div class="contact-modal-panel" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">

            <h2 id="contact-modal-title">
                お問い合わせ詳細
            </h2>

            <dl class="contact-detail-list">

                <div class="contact-detail-row">
                    <dt>受付日時</dt>
                    <dd id="detail-created-at">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>受付番号</dt>
                    <dd id="detail-reception-no">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>氏名</dt>
                    <dd id="detail-name">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>メール</dt>
                    <dd id="detail-email">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>電話番号</dt>
                    <dd id="detail-phone">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>お問い合わせ種別</dt>
                    <dd id="detail-type">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>件名</dt>
                    <dd id="detail-subject">―</dd>
                </div>

                <div class="contact-detail-row">
                    <dt>お問い合わせ内容</dt>
                    <dd id="detail-message" class="contact-message-body">
                        ―
                    </dd>
                </div>

            </dl>

            <div class="contact-modal-actions">
                <button type="button" id="contact-modal-close">
                    閉じる
                </button>
            </div>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 一箕ポータル Supabase設定 -->
    <script src="./supabase-config.js"></script>

    <!-- お問い合わせ管理 -->
    <script src="./contact-inquiries.js"></script>

</body>

</html>
