<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LINE登録者管理｜一箕地区ポータル</title>

    <link rel="stylesheet" href="./admin.css">
</head>

<body>

    <header class="admin-header">
        <div>
            <p class="admin-header-label">
                一箕地区ポータル
            </p>

            <h1>
                LINE登録者管理
            </h1>
        </div>

        <a href="./index.html" class="admin-back-link">
            管理トップへ戻る
        </a>
    </header>

    <main class="admin-main">

        <section class="admin-panel">

            <div class="line-user-summary">

                <div class="summary-card">
                    <span>友だち数</span>
                    <strong id="following-count">0</strong>
                </div>

                <div class="summary-card">
                    <span>住民登録済み</span>
                    <strong id="completed-count">0</strong>
                </div>

                <div class="summary-card">
                    <span>未登録</span>
                    <strong id="incomplete-count">0</strong>
                </div>

                <div class="summary-card">
                    <span>友だち解除</span>
                    <strong id="unfollowed-count">0</strong>
                </div>

            </div>

            <div class="line-user-filters">

                <div class="filter-item">
                    <label for="search-input">
                        検索
                    </label>

                    <input type="search" id="search-input" placeholder="表示名・氏名を検索">
                </div>

                <div class="filter-item">
                    <label for="district-filter">
                        地区
                    </label>

                    <select id="district-filter">
                        <option value="">すべて</option>
                        <option value="一箕地区">一箕地区</option>
                        <option value="地区外">地区外</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="registration-filter">
                        登録状況
                    </label>

                    <select id="registration-filter">
                        <option value="">すべて</option>
                        <option value="completed">登録済み</option>
                        <option value="incomplete">未登録</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="following-filter">
                        友だち状態
                    </label>

                    <select id="following-filter">
                        <option value="">すべて</option>
                        <option value="following">友だち</option>
                        <option value="unfollowed">解除済み</option>
                    </select>
                </div>

                <button type="button" id="refresh-button" class="admin-button">
                    再読み込み
                </button>

            </div>

            <p id="status-message" class="admin-status-message">
                LINE登録者を読み込んでいます。
            </p>

            <div class="admin-table-wrap">

                <table class="admin-table">

                    <thead>
                        <tr>
                            <th>LINE</th>
                            <th>登録氏名</th>
                            <th>地区</th>
                            <th>登録状況</th>
                            <th>友だち状態</th>
                            <th>登録日時</th>
                        </tr>
                    </thead>

                    <tbody id="line-users-body"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./line-users.js"></script>
</body>

</html>
